<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study x Panda</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐼</text></svg>">
<style>
:root{--bg:#0c0f0d;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--txt:#f4f7f4;--sub:#9fada3;--g:#7ed957;--g2:#2fa84f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--txt);min-height:100vh;
background-image:radial-gradient(600px 320px at 90% -5%,rgba(126,217,87,.2),transparent),radial-gradient(500px 300px at 0% 15%,rgba(255,255,255,.07),transparent);padding-bottom:40px}
.wrap{max-width:560px;margin:auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:12px;padding:26px 4px 6px}
.brand svg{width:54px;height:54px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.brand b{font-size:24px;letter-spacing:-.3px}
.brand b i{font-style:normal;color:var(--g);margin:0 3px}
.brand small{display:block;font:12px system-ui,sans-serif;color:var(--sub);margin-top:2px}
.hero{padding:16px 4px 6px}
.badge{display:inline-block;font:600 11px system-ui,sans-serif;color:var(--g);border:1px solid rgba(126,217,87,.4);padding:5px 12px;border-radius:20px;background:rgba(126,217,87,.08)}
.hero h1{font-size:32px;line-height:1.15;margin:14px 0 8px;letter-spacing:-.5px}
.hero h1 span{background:linear-gradient(90deg,var(--g),#d4f7b8);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font:14px/1.5 system-ui,sans-serif;color:var(--sub)}
.stats{display:flex;gap:10px;margin:18px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;backdrop-filter:blur(10px)}
.stat b{display:block;font-size:20px;color:var(--g)}
.stat small{font:11px system-ui,sans-serif;color:var(--sub)}
.search{position:sticky;top:0;z-index:5;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.search input{width:100%;padding:15px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--txt);font:15px system-ui,sans-serif;outline:none;transition:.2s}
.search input:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(126,217,87,.2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font:600 13px system-ui,sans-serif;padding:9px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);white-space:nowrap;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--g),var(--g2));color:#07210d;border-color:transparent}
.card{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:12px;border-radius:20px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);text-decoration:none;color:inherit;transition:transform .15s,border-color .2s}
.card:active{transform:scale(.98)}
.card:hover{border-color:rgba(126,217,87,.55)}
.ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex-shrink:0;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.tx{flex:1;min-width:0}
.tx h3{font-size:16px}
.tx p{font:12.5px/1.4 system-ui,sans-serif;color:var(--sub);margin-top:3px}
.tg{display:inline-block;font:600 10.5px system-ui,sans-serif;color:var(--g);margin-top:6px}
.go{font:700 13px system-ui,sans-serif;color:#07210d;background:linear-gradient(135deg,#b6f08f,var(--g));padding:9px 18px;border-radius:14px}
.empty{text-align:center;color:var(--sub);font:14px system-ui,sans-serif;padding:40px 0}
footer{text-align:center;font:12px system-ui,sans-serif;color:var(--sub);margin-top:24px}
footer b{color:var(--g)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 64 64"><circle cx="13" cy="14" r="10" fill="#111"/><circle cx="51" cy="14" r="10" fill="#111"/><circle cx="32" cy="35" r="25" fill="#fff"/><ellipse cx="21" cy="32" rx="7" ry="9" fill="#111" transform="rotate(-20 21 32)"/><ellipse cx="43" cy="32" rx="7" ry="9" fill="#111" transform="rotate(20 43 32)"/><circle cx="22" cy="31" r="2.6" fill="#fff"/><circle cx="42" cy="31" r="2.6" fill="#fff"/><ellipse cx="32" cy="43" rx="4.5" ry="3.3" fill="#111"/><path d="M26 49q6 5 12 0" stroke="#111" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <div><b>Study<i>x</i>Panda</b><small>Padho. Practice karo. Pass ho jao.</small></div>
  </div>
  <div class="hero">
    <span class="badge">100% FREE • NO SUBSCRIPTION</span>
    <h1>Free Mock Tests &amp; <span>Study Hub</span></h1>
    <p>Unlimited practice, e-books aur AI quiz. Koi hidden charge nahi.</p>
  </div>
  <div class="stats">
    <div class="stat"><b>7</b><small>Platforms</small></div>
    <div class="stat"><b>1000+</b><small>E-Books</small></div>
    <div class="stat"><b>₹0</b><small>Price</small></div>
  </div>
  <div class="search"><input id="q" type="search" placeholder="Search tests, books, tools..."></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <footer>Made with 🐼 by <b>Study x Panda</b>. Friends ke saath share karo.</footer>
</div>
<script>
var apps=[
{n:"All-in-One Educational Portal",d:"Saare study resources ek jagah",i:"🌐",c:"linear-gradient(135deg,#2fa84f,#1b6e34)",t:"Portal",u:"https://ankitspecial.silentpreparationhub.workers.dev/"},
{n:"GK Compilation Practice",d:"GK questions ka practice set",i:"🧠",c:"linear-gradient(135deg,#ff5f8d,#ff8a5c)",t:"Practice",u:"https://lingering-poetry-7369.gkcompilation.workers.dev/"},
{n:"Black Book English Vocab",d:"English vocabulary practice",i:"📖",c:"linear-gradient(135deg,#2b2f2c,#0f1210)",t:"Practice",u:"https://share.google/w5VyTSVOEn0vwZ1wn"},
{n:"Chapter-Wise Mock Tests",d:"Chapter ke hisaab se mock tests",i:"📝",c:"linear-gradient(135deg,#ffb347,#ff7e2d)",t:"Mock Test",u:"https://ankitprep.silentpreparationhub.workers.dev/"},
{n:"Pareeksha Kendra",d:"Full mock test portal",i:"🏛️",c:"linear-gradient(135deg,#a24bff,#6c3bff)",t:"Mock Test",u:"https://pareekshakendra.pareekshakendraankit.workers.dev/"},
{n:"Instant AI Quiz Maker",d:"AI se turant quiz banao",i:"🤖",c:"linear-gradient(135deg,#17c3d6,#2b8cff)",t:"Tools",u:"https://ankitspecial.silentpreparationhub.workers.dev/app/ai-quiz-creation-"},
{n:"Digital Library",d:"1000+ free e-books",i:"📚",c:"linear-gradient(135deg,#7ed957,#3ea83a)",t:"Books",u:"https://my-book.a69230174.workers.dev/"}
];
var cats=["All"],cur="All";
apps.forEach(function(a){if(cats.indexOf(a.t)<0)cats.push(a.t)});
function chips(){document.getElementById("chips").innerHTML=cats.map(function(c){return '<div class="chip'+(c===cur?' on':'')+'" data-c="'+c+'">'+c+'</div>'}).join("")}
function list(){
  var q=document.getElementById("q").value.toLowerCase(),h="";
  apps.forEach(function(a){
    if((cur==="All"||a.t===cur)&&(a.n+" "+a.d).toLowerCase().indexOf(q)>=0){
      h+='<a class="card" href="'+a.u+'" target="_blank" rel="noopener"><div class="ic" style="background:'+a.c+'">'+a.i+'</div><div class="tx"><h3>'+a.n+'</h3><p>'+a.d+'</p><span class="tg">'+a.t+'</span></div><span class="go">Open</span></a>';
    }
  });
  document.getElementById("list").innerHTML=h||'<div class="empty">Kuch nahi mila. Dusra naam try karo.</div>';
}
document.getElementById("chips").addEventListener("click",function(e){var c=e.target.getAttribute("data-c");if(c){cur=c;chips();list()}});
document.getElementById("q").addEventListener("input",list);
chips();list();
</script>
</body>
</html>
